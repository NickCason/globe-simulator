<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3E8D2">
  <meta name="robots" content="noindex">
  <title>Terralogue · draft: streets on the globe</title>
  <style>
    :root { --paper: #F3E8D2; --ink: #2B231D; --accent: #B4532F; --muted: #7A6450; --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
            --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--ui); -webkit-font-smoothing: antialiased; }
    #globe { position: fixed; inset: 0; touch-action: none; cursor: grab; }
    #globe canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #globe canvas.ink { pointer-events: none; }
    #globe .pins { position: absolute; inset: 0; pointer-events: none; }
    .top { position: fixed; z-index: 5; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 10px;
           background: linear-gradient(var(--paper) 55%, transparent); pointer-events: none; }
    .top h1 { margin: 0; font: 400 24px/1.1 var(--serif); }
    .top p { margin: 4px 0 10px; font-size: 12.5px; color: var(--muted); max-width: 34em; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; pointer-events: auto; }
    .chips button { appearance: none; border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); background: color-mix(in srgb, var(--paper) 90%, #fff);
                    border-radius: 999px; padding: 8px 13px; font: 600 13px var(--ui); color: var(--ink); cursor: pointer; }
    .chips button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .chips .dive { background: var(--accent); border-color: var(--accent); color: #fff; }
    .hud { position: fixed; z-index: 5; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); translate: -50% 0; padding: 8px 14px; border-radius: 999px;
           background: color-mix(in srgb, var(--paper) 88%, transparent); border: 1px solid color-mix(in srgb, var(--ink) 15%, transparent);
           font: 600 12.5px var(--ui); color: var(--muted); white-space: nowrap; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
    .hud b { color: var(--ink); }
    .credit { position: fixed; z-index: 5; right: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 64px); font: 10px var(--ui); color: var(--muted); }
    .credit a { color: inherit; }
  </style>
</head>
<body>
  <div id="globe"></div>
  <header class="top">
    <h1>Streets on the globe</h1>
    <p>A draft of where Terralogue is going: the streets drawn on the globe itself, in the same ink, coming in as you come down.
      Pick a city, then pinch or scroll in (or Dive).</p>
    <div class="chips" id="chips">
      <button data-c="paris">Paris</button><button data-c="toledo">Toledo</button><button data-c="kyoto">Kyoto</button>
      <button data-c="newyork">New York</button><button data-c="sf">San Francisco</button><button class="dive" id="dive">Dive</button>
    </div>
  </header>
  <div class="hud" id="hud">Choose a city</div>
  <p class="credit">Streets: <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> © OpenMapTiles © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></p>
  <script type="module" src="../src/lab-streets.js"></script>
</body>
</html>
