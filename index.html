<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3E8D2">
  <meta name="description" content="A visual journal of the world on a hand-drawn globe. Pin photos, notes and posts to any place. Everything stays on your device.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Terralogue">
  <title>Terralogue</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <main id="stage">
    <div id="globe" class="globe" aria-label="Your globe: drag to turn, pinch or scroll to zoom, tap a spot to make a place"></div>
    <header class="title"><h1>Terralogue</h1><p id="tally">a visual journal of the world</p></header>
    <button class="corner" id="mapbtn" aria-label="The map: ink, style and layers">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5z"/><path d="m3 12.5 9 5 9-5M3 16.5l9 5 9-5"/></svg>
    </button>
    <button class="globeback" id="globeback" aria-label="Back up to the globe">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c-3 2.5-3 14.5 0 17M12 3.5c3 2.5 3 14.5 0 17"/></svg><span>Globe</span>
    </button>
    <button class="corner" id="settings" aria-label="Settings and backup">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
    </button>
    <nav class="dock" id="dock">
      <button data-do="here"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg><span>Here</span></button>
      <button data-do="find"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg><span>Find</span></button>
      <button data-do="photo" class="main"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg><span>Photo</span></button>
      <button data-do="journal"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg><span>Journal</span></button>
    </nav>
    <section class="sheet" id="sheet" aria-live="polite"><div class="grab" id="grab"></div><div class="sheet-body" id="sheetBody"></div></section>
    <div class="toasts" id="toasts"></div>
    <input type="file" id="pickPhotos" accept="image/*" multiple hidden>
    <input type="file" id="pickBackup" accept=".gz,.json,application/json,application/gzip" hidden>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
